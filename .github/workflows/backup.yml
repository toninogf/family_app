name: Copia de seguridad semanal

# Cada lunes a las 03:00 UTC, y a mano desde la pestaña Actions ("Run workflow").
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     cadena de conexión "Session pooler" de Supabase (con la contraseña de la base de datos)
#   BACKUP_PASSPHRASE   frase larga para cifrar la copia; guárdala en tu gestor de contraseñas
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_URL o BACKUP_PASSPHRASE"
            exit 1
          fi

      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar y cifrar
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -uo pipefail
          name="family-app-$(date -u +%Y-%m-%d)"
          # Muestra el error como aviso legible, ocultando cualquier contraseña
          fail() { msg=$(sed -E 's#(postgres(ql)?://[^:/@]+:)[^@]*@#\1***@#g; s/password[^ ]*/password ***/Ig; s/"[^"]*"/"***"/g' "$1" | tr '\n' ' ' | cut -c1-500); echo "::error title=$2::$msg"; exit 1; }
          # Si es la conexión directa (solo IPv6, que GitHub no tiene), probar el Session pooler equivalente
          candidates=$(python3 - <<'PY'
          import os, urllib.parse as u
          url = os.environ["DB_URL"]
          p = u.urlsplit(url)
          print(url)
          host = p.hostname or ""
          if host.startswith("db.") and host.endswith(".supabase.co"):
              ref = host.split(".")[1]
              user = p.username if (p.username or "").startswith("postgres.") else f"postgres.{ref}"
              pw = u.quote(u.unquote(p.password or ""), safe="")
              for pre in ("aws-0", "aws-1"):
                  print(f"postgresql://{user}:{pw}@{pre}-eu-west-3.pooler.supabase.com:5432/{(p.path or '/postgres').lstrip('/') or 'postgres'}")
          PY
          )
          ok=""
          while read -r cand; do
            [ -z "$cand" ] && continue
            echo "::add-mask::$cand"
            if /usr/lib/postgresql/17/bin/psql "$cand" -tAc "select 1" > /dev/null 2> conn.err; then ok="$cand"; break; fi
          done <<< "$candidates"
          if [ -z "$ok" ]; then fail conn.err "No se pudo conectar"; fi
          DB_URL="$ok"
          if ! /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --schema=public --schema=private --schema=auth \
            --no-owner --no-privileges --quote-all-identifiers \
            -f "$name.sql" 2> dump.err; then fail dump.err "Fallo de pg_dump"; fi
          set -e
          gzip -9 "$name.sql"
          test -s "$name.sql.gz"
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$PASS" -o "$name.sql.gz.gpg" "$name.sql.gz"
          rm "$name.sql.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"
          ls -lh "$name.sql.gz.gpg"

      - name: Guardar copia cifrada (60 días)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.sql.gz.gpg
          retention-days: 60
          if-no-files-found: error
